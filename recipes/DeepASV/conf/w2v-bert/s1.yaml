seed: 24
__set_seed: !apply:deeplab.utils.misc.set_random_seed [!ref <seed>]

use_amp: true
use_gradient_clipping: true
gradient_accumulation: 1
cudnn_benchmark: false

wandb_cfgs:
    project: w2vbert-sv
    watch: true
    log: gradients
    log_freq: 100

optimizer: !name:torch.optim.AdamW
    lr: 0.00005
    weight_decay: 0.0001

scheduler: !name:deeplab.core.scheduler.WarmupLR_withStepDecay
    warmup_step: 5
    decay_step: 5
    gamma: 0.1

num_epochs: 15
max_iters_per_epoch: null
batch_size: 64
valid_batch_size: 1
training_loop: 1
num_workers: 14
output_dir: /home/john.zheng1/voicegeneration/w2vbert_sv_results/

items_save: False
item_save_steps: 500

dur_range: [2, 3]
max_valid_dur: 60
speed_perturbation: [0.9, 1.1]
data_aug: true
embd_dim: 256

sample_rate: 16000

train_tar_index: /scratch/48054831/voxceleb2-dev-wds/voxceleb2.index.sqlite3
tar_max_open_shards: 32

musan_path: /home/john.zheng1/voicegeneration/musan.tar
rirs_path: /home/john.zheng1/voicegeneration/RIRS_NOISES

train_data: []


valid_data: [{scp_path: '/scratch/48054834/voxceleb1/protocols/vox1-o/wav.scp', trial_path: '/scratch/48054834/voxceleb1/protocols/vox1-o/trials'}]

peft_config: !apply:deeplab.pretrained.audio2vector.api.create_lora_config
    model_type: 'w2v-bert'
    r: 64
    lora_alpha: 128
    target_modules: ["linear_q", "linear_v"]
    lora_dropout: 0.0
    bias: 'none'

spk_model: !new:local.spk_model.Audio2Vec_based_Adapter
    model_name: '/home/john.zheng1/voicegeneration/models/facebook/w2v-bert-2.0'
    frozen_encoder: true
    bnb_config: null
    peft_config: !ref <peft_config>
    encoder_config: 'config_tea.json' # Don't use 'config_prune_tea.json', as it will skip loading the initialization weights.
    n_mfa_layers: -1
    pooling_layer: 'ASP' 
    embd_dim: !ref <embd_dim> 
    adapter_dim: 128
    dropout: 0.0


classifier: !new:local.spk_classifier.ArcFace
    in_features: !ref <embd_dim>
    out_features:  17982
    s: 32
    m: 0.2

modules: 
    spk_model: !ref <spk_model>
    classifier: !ref <classifier>