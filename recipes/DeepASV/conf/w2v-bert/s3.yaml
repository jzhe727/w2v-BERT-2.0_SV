seed: 24
__set_seed: !apply:deeplab.utils.misc.set_random_seed [!ref <seed>]

use_amp: true
use_gradient_clipping: true
gradient_accumulation: 1
cudnn_benchmark: false

wandb_cfgs:
    project: w2vbert-sv
    watch: true
    log: gradients
    log_freq: 100

optimizer: !name:torch.optim.AdamW
    lr: 0.000005
    weight_decay: 0.0001

scheduler_lmft: !name:deeplab.core.scheduler.WarmupCosineScheduler
    min_lr: 0.0000025
    max_lr: 0.000005
    warmup_epoch: 0
    fix_epoch: 1

num_epochs: 2
max_iters_per_epoch: null
batch_size: 32
valid_batch_size: 1
training_loop: 1
num_workers: 16
output_dir: /home/john.zheng1/voicegeneration/w2vbert_sv_results/

items_save: false
item_save_steps: 500

dur_range: [5, 6]
max_valid_dur: 60
speed_perturbation: []
data_aug: false
embd_dim: 256
# compute fbank features in the DataLoader workers (identical output, frees the main process)
features_in_loader: true
# fail instead of silently partial-loading --pretrain/--resume (encoder config skips safetensors)
strict_pretrain_modules: [spk_model]

sample_rate: 16000

train_tar_index: /scratch/49572342/voxceleb2-dev-wds/voxceleb2.index.sqlite3
tar_max_open_shards: 32

musan_path: /home/john.zheng1/voicegeneration/musan.tar
rirs_path: /home/john.zheng1/voicegeneration/RIRS_NOISES

train_data: []


valid_data: [{scp_path: '/scratch/49572343/voxceleb1/protocols/vox1-o/wav.scp', trial_path: '/scratch/49572343/voxceleb1/protocols/vox1-o/trials'}]


peft_config: null

spk_model: !new:local.spk_model.Audio2Vec_based_Adapter
    model_name: '/home/john.zheng1/voicegeneration/models/facebook/w2v-bert-2.0'
    frozen_encoder: false
    bnb_config: null
    peft_config: !ref <peft_config>
    encoder_config: 'config_prune_tea.json'
    n_mfa_layers: -1
    pooling_layer: 'ASP' 
    embd_dim: !ref <embd_dim> 
    adapter_dim: 128
    dropout: 0.0


classifier: !new:local.spk_classifier.ArcFace
    in_features: !ref <embd_dim>
    out_features:  5994
    s: 32
    m: 0.5

modules: 
    spk_model: !ref <spk_model>
    classifier: !ref <classifier>